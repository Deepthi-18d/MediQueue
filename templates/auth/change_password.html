{% extends 'base.html' %}

{% block title %}Change Password – {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary-gradient text-white p-4 text-center border-0">
                    <div class="brand-icon-box mx-auto mb-2">
                        <i class="fa-solid fa-key text-primary fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Update Password</h4>
                    <p class="text-slate-300 small mb-0">Ensure your account remains safe with a strong password</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.change_password') }}">
                        <div class="mb-3">
                            <label for="current_password" class="form-label small fw-semibold text-muted">Current Password *</label>
                            <input type="password" class="form-control rounded-3 shadow-none" id="current_password" name="current_password" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="new_password" class="form-label small fw-semibold text-muted">New Password * (min 6 characters)</label>
                            <input type="password" class="form-control rounded-3 shadow-none" id="new_password" name="new_password" minlength="6" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label small fw-semibold text-muted">Confirm New Password *</label>
                            <input type="password" class="form-control rounded-3 shadow-none" id="confirm_password" name="confirm_password" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
                            <i class="fa-solid fa-lock-check me-1"></i> Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
