{% extends 'base.html' %}

{% block title %}{{ code }} – {{ title }} – MediQueue{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-5">
                <div class="brand-icon-box mx-auto mb-3 bg-danger-subtle text-danger" style="width: 72px; height: 72px; font-size: 2rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h1 class="display-4 fw-bold text-dark">{{ code }}</h1>
                <h4 class="fw-bold text-muted mb-3">{{ title }}</h4>
                <p class="text-muted mb-4">{{ message }}</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-primary bg-primary-gradient rounded-pill px-4">
                        <i class="fa-solid fa-house me-1"></i> Return to Home
                    </a>
                    <button onclick="window.history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                        Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
