{% extends 'base.html' %}

{% block title %}My Profile – {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="fa-solid fa-id-card text-primary me-2"></i>Patient Profile Details
                    </h5>
                    <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-key me-1"></i> Change Password
                    </a>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('patient.profile') }}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label small fw-semibold text-muted">Username</label>
                                <input type="text" class="form-control rounded-3 bg-light" id="username" value="{{ current_user.username }}" readonly>
                                <div class="form-text fs-xs text-muted">Usernames cannot be modified.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                                <input type="email" class="form-control rounded-3 bg-light" id="email" value="{{ current_user.email or '' }}" readonly>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="full_name" class="form-label small fw-semibold text-muted">Full Legal Name *</label>
                                <input type="text" class="form-control rounded-3 shadow-none" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label small fw-semibold text-muted">Contact Phone Number</label>
                                <input type="tel" class="form-control rounded-3 shadow-none" id="phone" name="phone" value="{{ current_user.phone or '' }}">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="blood_group" class="form-label small fw-semibold text-muted">Blood Group</label>
                                <select class="form-select rounded-3 shadow-none" id="blood_group" name="blood_group">
                                    <option value="" {% if not profile.blood_group %}selected{% endif %}>Select</option>
                                    {% for bg in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                                    <option value="{{ bg }}" {% if profile.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="date_of_birth" class="form-label small fw-semibold text-muted">Date of Birth</label>
                                <input type="date" class="form-control rounded-3 shadow-none" id="date_of_birth" name="date_of_birth" value="{{ profile.date_of_birth or '' }}">
                            </div>
                            <div class="col-md-4">
                                <label for="emergency_contact" class="form-label small fw-semibold text-muted">Emergency Contact</label>
                                <input type="tel" class="form-control rounded-3 shadow-none" id="emergency_contact" name="emergency_contact" value="{{ profile.emergency_contact or '' }}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label small fw-semibold text-muted">Residential Address</label>
                            <textarea class="form-control rounded-3 shadow-none" id="address" name="address" rows="2">{{ profile.address or '' }}</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold shadow-sm">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                        </button>
                        <a href="{{ url_for('patient.dashboard') }}" class="btn btn-light rounded-pill px-4 py-2 ms-2">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
