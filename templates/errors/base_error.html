<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error{% endblock %} – MediQueue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; }
        .error-code { font-size: 7rem; font-weight: 800; line-height: 1; }
        .error-icon { font-size: 4rem; }
    </style>
</head>
<body>
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            {% block error_content %}
            <div class="text-primary error-code mb-2">{{ code }}</div>
            <i class="fa-solid fa-triangle-exclamation text-warning error-icon mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">{{ title }}</h3>
            <p class="text-muted mb-4">{{ message }}</p>
            <a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            {% endblock %}
        </div>
    </div>
</div>
</body>
</html>
