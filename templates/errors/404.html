{% extends 'errors/base_error.html' %}
{% block title %}404 Page Not Found{% endblock %}
{% block error_content %}
<div class="text-primary error-code mb-2">404</div>
<i class="fa-solid fa-map-location-dot text-primary error-icon mb-3"></i>
<h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
<p class="text-muted mb-4">The page you're looking for has moved, been removed, or never existed. Please check the URL and try again.</p>
<a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="fa-solid fa-house me-1"></i> Return to Live Board</a>
{% endblock %}
