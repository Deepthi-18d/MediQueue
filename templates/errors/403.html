{% extends 'errors/base_error.html' %}
{% block title %}403 Access Forbidden{% endblock %}
{% block error_content %}
<div class="text-danger error-code mb-2">403</div>
<i class="fa-solid fa-lock text-danger error-icon mb-3"></i>
<h3 class="fw-bold text-dark mb-2">Access Forbidden</h3>
<p class="text-muted mb-4">You do not have the necessary permissions to access this resource. Please contact hospital administration.</p>
<a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm me-2"><i class="fa-solid fa-house me-1"></i> Return Home</a>
<a href="/login" class="btn btn-outline-secondary rounded-pill px-4">Sign In Again</a>
{% endblock %}
