{% extends 'errors/base_error.html' %}
{% block title %}400 Bad Request{% endblock %}
{% block error_content %}
<div class="text-warning error-code mb-2">400</div>
<i class="fa-solid fa-circle-exclamation text-warning error-icon mb-3"></i>
<h3 class="fw-bold text-dark mb-2">Bad Request</h3>
<p class="text-muted mb-4">The server could not understand your request due to invalid syntax or malformed data.</p>
<a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="fa-solid fa-house me-1"></i> Return Home</a>
{% endblock %}
