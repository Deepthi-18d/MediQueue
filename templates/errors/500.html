{% extends 'errors/base_error.html' %}
{% block title %}500 Internal Server Error{% endblock %}
{% block error_content %}
<div class="text-danger error-code mb-2">500</div>
<i class="fa-solid fa-server text-danger error-icon mb-3"></i>
<h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
<p class="text-muted mb-4">MediQueue encountered an unexpected error. The technical team has been notified. Please try again shortly.</p>
<a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm"><i class="fa-solid fa-house me-1"></i> Return Home</a>
{% endblock %}
